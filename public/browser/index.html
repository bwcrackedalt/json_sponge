<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<link rel="stylesheet" href="styles.css">
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #17151e;
    color: white;
}

#viewer {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
    touch-action: none;
}

#toolbar {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    gap: 8px;
    align-items: center;
    background: #24202e;
    padding: 10px;
    border-radius: 8px;
}

select, button {
    background: #393248;
    color: white;
    border: 1px solid #665580;
    padding: 9px;
    border-radius: 5px;
}

#info {
    position: fixed;
    bottom: 12px;
    left: 12px;
    background: #24202e;
}
    </style>
</head>

<body>

<div id="viewer"></div>

<div id="toolbar">
    <select id="modelSelect">
        <optgroup label="Cars">
        <option value="../cars/car1.glb">Police Boat</option>
        <option value="../cars/car2.glb">Submarine Bus</option>
        </optgroup>
        <optgroup label="Characters">
        <option value="../characters/perch.glb">Perch</option>
            <option value="../characters/plankton.glb">Plankton</option>
        </optgroup>
        <optgroup label="Maps">
<option value="../maps/krusty-krabs.glb">The krusty krab</option>
            <option value="../maps/bikini1.glb">Krusty Krab Outside</option>
        </optgroup>
    </select>

    <button onclick="resetCamera()">Reset</button>
</div>

<div id="info">
    Drag: Rotate | Right drag: Pan | Scroll: Zoom | Pinch: Zoom
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const container = document.getElementById("viewer");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17151e);

const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.01,
    1000
);

camera.position.set(0, 2, 5);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 10, 7);
scene.add(light);

// Grid
/*const grid = new THREE.GridHelper(20, 20, 0x665580, 0x383344);
scene.add(grid);*/

// Model
const loader = new GLTFLoader();

let currentModel = null;

async function loadModel(url) {
    if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
    }

    try {
        const gltf = await loader.loadAsync(url);

        currentModel = gltf.scene;
        scene.add(currentModel);

        // Center model
        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());

        currentModel.position.sub(center);

        // Fit camera to model
        const size = box.getSize(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);

        distance = Math.max(maxSize * 2.5, 1);
        target.set(0, 0, 0);

        updateCamera();

    } catch (error) {
        console.error("Model loading failed:", error);
        alert("Could not load model: " + url);
    }
}

// Camera controls
const target = new THREE.Vector3(0, 0, 0);

let distance = 5;
let rotationX = 0.3;
let rotationY = 0;

function updateCamera() {
    const offset = new THREE.Vector3(
        distance * Math.sin(rotationY) * Math.cos(rotationX),
        distance * Math.sin(rotationX),
        distance * Math.cos(rotationY) * Math.cos(rotationX)
    );

    camera.position.copy(target).add(offset);
    camera.lookAt(target);
}

function resetCamera() {
    rotationX = 0.3;
    rotationY = 0;
    distance = 5;
    target.set(0, 0, 0);
    updateCamera();
}

window.resetCamera = resetCamera;

// Input handling
const canvas = renderer.domElement;

let pointers = new Map();
let lastX = 0;
let lastY = 0;
let lastPinch = 0;
let dragging = false;
let dragButton = 0;

canvas.addEventListener("contextmenu", e => e.preventDefault());

function getPinchDistance() {
    const points = [...pointers.values()];

    if (points.length < 2) return 0;

    return Math.hypot(
        points[0].x - points[1].x,
        points[0].y - points[1].y
    );
}

canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);

    pointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    if (pointers.size === 1) {
        dragging = true;
        dragButton = e.button;
        lastX = e.clientX;
        lastY = e.clientY;
    }

    if (pointers.size === 2) {
        lastPinch = getPinchDistance();
    }
});

canvas.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;

    const old = pointers.get(e.pointerId);

    const dx = e.clientX - old.x;
    const dy = e.clientY - old.y;

    pointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    if (pointers.size >= 2) {
        const pinch = getPinchDistance();

        if (lastPinch > 0) {
            distance *= lastPinch / pinch;
            distance = THREE.MathUtils.clamp(distance, 0.1, 500);
        }

        lastPinch = pinch;

        // Two-finger pan
        const right = new THREE.Vector3()
            .setFromMatrixColumn(camera.matrixWorld, 0);

        const up = new THREE.Vector3()
            .setFromMatrixColumn(camera.matrixWorld, 1);

        const scale = distance * 0.002;

        target.addScaledVector(right, -dx * scale);
        target.addScaledVector(up, dy * scale);

        updateCamera();
        return;
    }

    if (dragging) {
        if (dragButton === 2) {
            // Right mouse drag: Pan
            const right = new THREE.Vector3()
                .setFromMatrixColumn(camera.matrixWorld, 0);

            const up = new THREE.Vector3()
                .setFromMatrixColumn(camera.matrixWorld, 1);

            const scale = distance * 0.002;

            target.addScaledVector(right, -dx * scale);
            target.addScaledVector(up, dy * scale);

        } else {
            // Left mouse / one finger: Rotate
            rotationY -= dx * 0.008;
            rotationX += dy * 0.008;

            rotationX = THREE.MathUtils.clamp(
                rotationX,
                -1.5,
                1.5
            );
        }

        updateCamera();
    }

    lastX = e.clientX;
    lastY = e.clientY;
});

function removePointer(e) {
    pointers.delete(e.pointerId);

    if (pointers.size === 0) {
        dragging = false;
    }

    if (pointers.size === 2) {
        lastPinch = getPinchDistance();
    } else {
        lastPinch = 0;
    }
}

canvas.addEventListener("pointerup", removePointer);
canvas.addEventListener("pointercancel", removePointer);

canvas.addEventListener("wheel", e => {
    e.preventDefault();

    distance *= e.deltaY > 0 ? 1.1 : 0.9;
    distance = THREE.MathUtils.clamp(distance, 0.1, 500);

    updateCamera();
}, { passive: false });

// Model selector
document.getElementById("modelSelect").addEventListener("change", e => {
    loadModel(e.target.value);
});

// Resize
window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);
});

// Animation
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

updateCamera();
animate();

// Initial model
loadModel(document.getElementById("modelSelect").value);

</script>
</body>
</html>
