<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ai sponge but you have to do it with json</title>

  <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <script>
      document.querySelector(".card").image =
        `cards/sprite_${String(Math.floor(Math.random() * 24)).padStart(3, "0")}.png`;
    </script>
    <div class="card dark-start" image="cards/sprite_003.png" hidden>
      <p class="title">Card Content</p>
    </div>

    <div id="game" hidden></div>

    <div id="topbar">
      <strong>3D Episode Generator</strong>
      <button id="togglePanel">Editor</button>
      <button id="resetScene">Reset</button>
    </div>

    <div id="panel">
      <button id="hidePanel">×</button>

      <h3>Episode mode</h3>
      <div class="row">
        <button id="aiMode">AI Mode</button>
        <button id="jsonMode">Advanced JSON</button>
      </div>

      <section id="aiSection">
        <label>Episode prompt</label>
        <textarea
          id="prompt"
          placeholder="A character walks into a town, talks to another character, and cars drive by..."
        ></textarea>
        <button id="generateAI" style="width: 100%; margin-top: 7px">
          Generate episode
        </button>
      </section>

      <section id="jsonSection" style="display: none">
        <label>Episode JSON</label>
        <textarea id="episodeJSON">
  [
  {"title": "Hello"},
  {"map": "/maps/bikini1.glb"},
  {
    "createCharacter": {
      "name": "Squidward",
      "model": "/characters/squidward.glb",
      "position": [0, 0, 0],
      "prompt": "You are Squidward, a grumpy squid.",
  "fishaudio": "faa6ab0c00e4476b84a9226326acedea"
    }
  },
  {
    "createCharacter": {
      "name": "Spongebob",
      "model": "/characters/spongebob.glb",
      "position": [6, 0, 2],
      "prompt": "You are Spongebob.",
  "fishaudio": "9845e056f37b470d9a1005e41c864e25"
    }
  },
  {
    "createNPCS": {
      "count": 30,
      "models": ["/npcs/fish1.glb", "/npcs/fish2.glb"],
      "rangePos": 50,
      "wander": true
    }
  },
  
  {
    "target": "Squidward",
    "text": "Hello! Let's take a look around."
  },
{
    "createTraffic": {
      "cars": ["/cars/car1.glb", "/cars/car2.glb"],
      "speed": 100,
      "count": 10
    }
  },
  {
    "target": "Spongebob",
    "text": "Sounds good. I will show you the way. Make your own episode!"
    }
]
</textarea>
        <button id="playJSON" style="width: 100%; margin-top: 7px">
          Play JSON
        </button>
      </section>

      <h3>Map</h3>
      <label>Map GLB URL</label>
      <input id="mapURL" placeholder="https://example.com/map.glb" />
      <button id="loadMap" style="width: 100%; margin-top: 7px">
        Load map
      </button>
      <!--<h3>Character chat</h3>!-->
      <label>Based off <a href="https://aisponge.net/">AI Sponge!</a></label>
      <input id="chatCharacter" value="Alex" style="display: none;" />
      <div id="status">Ready.</div>
    </div>
    <div id="chat" hidden>
      <div id="chatLog">Episode chat</div>
      <input id="chatInput" placeholder="Say something..." />
      <button id="sendChat" style="width: 100%">Send</button>
    </div>
    <div id="crosshair"></div>
    <div id="subtitle" role="status" aria-live="polite"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        //function updateCard(){
        //setInterval(()=>{
        const cards = document.querySelectorAll(".card");

        cards.forEach((card) => {
          const imgUrl = card.getAttribute("image");
          if (imgUrl) {
            card.style.backgroundImage = `url('cards/sprite_${String(Math.floor(Math.random() * 24)).padStart(3, "0")}.png')`;
          }
        });
        //}
        //  setInterval(function(){updatdCard()}, 100);
      });
    </script>
    <div id="youtube-player"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
