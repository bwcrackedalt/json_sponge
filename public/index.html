<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Episode Generator</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#15131d;color:white;font-family:Arial,sans-serif;overflow:hidden}
button,input,textarea{font:inherit}
button{background:#7654b9;color:white;border:0;padding:9px 13px;border-radius:5px;cursor:pointer}
button:hover{background:#9270d4}
input,textarea{background:#211e2b;color:white;border:1px solid #494153;padding:10px;border-radius:5px;width:100%}
#game{position:fixed;inset:0}
#topbar{position:fixed;top:0;left:0;right:0;height:48px;background:#201c2b;display:flex;align-items:center;padding:0 12px;gap:10px;z-index:5;border-bottom:1px solid #423950}
#topbar strong{margin-right:auto}
#panel{position:fixed;top:58px;left:10px;bottom:10px;width:310px;background:#201c2bee;border:1px solid #453b54;border-radius:8px;padding:12px;overflow:auto;z-index:5}
#panel h3{margin:12px 0 7px;font-size:15px}
#panel label{display:block;font-size:12px;color:#c8bdd9;margin:8px 0 4px}
#panel textarea{height:180px;resize:vertical;font-family:monospace;font-size:12px}
.row{display:flex;gap:6px;margin-top:7px}
.row>*{flex:1}
#status{font-size:12px;color:#c5b5df;margin-top:8px;white-space:pre-wrap}
#chat{position:fixed;right:10px;bottom:10px;width:260px;background:#201c2bee;border:1px solid #453b54;border-radius:8px;padding:10px;z-index:5}
#chatLog{height:150px;overflow:auto;font-size:12px;margin-bottom:8px;white-space:pre-wrap}
#chat input{margin-bottom:6px}
#hidePanel{position:absolute;right:10px;top:10px}
#panel.hidden{display:none}
#crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;background:white;border-radius:50%;opacity:.5;pointer-events:none}
#subtitle{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);width:min(92vw,1100px);display:none;text-align:center;color:#fff;font-size:clamp(22px,3vw,38px);font-weight:700;line-height:1.25;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 4px 8px #000;pointer-events:none;z-index:10}
body.json-playing #topbar,body.json-playing #panel,body.json-playing #chat,body.json-playing #crosshair{display:none}
@media(max-width:650px){
 #panel{width:calc(100% - 20px);max-height:48vh;bottom:auto}
 #chat{width:calc(100% - 20px);bottom:10px}
 #chatLog{height:75px}
}
</style>
</head>

<body>
<div id="game"></div>

<div id="topbar">
<strong>3D Episode Generator</strong>
<button id="togglePanel">Editor</button>
<button id="resetScene">Reset</button>
</div>

<div id="panel">
<button id="hidePanel">×</button>

<h3>Episode mode</h3>
<div class="row">
<button id="aiMode">AI Mode</button>
<button id="jsonMode">Advanced JSON</button>
</div>

<section id="aiSection">
<label>Episode prompt</label>
<textarea id="prompt" placeholder="A character walks into a town, talks to another character, and cars drive by..."></textarea>
<button id="generateAI" style="width:100%;margin-top:7px">Generate episode</button>
</section>

<section id="jsonSection" style="display:none">
<label>Episode JSON</label>
<textarea id="episodeJSON">[
  {
    "createCharacter": {
      "name": "Perch",
      "model": "/characters/perch.glb",
      "position": [0, 0, 0],
      "prompt": "You are Perch, a friendly reporter."
    }
  },
  {
    "createNPCS": {
      "count": 1,
      "models": ["/characters/perch.glb"],
      "rangePos": 15,
      "wander": true
    }
  },
  {
    "createTraffic": {
      "cars": ["/cars/car1.glb"],
      "speed": 5,
      "count": 1
    }
  },
  {
    "target": "Perch",
    "text": "Hello! Let's take a look around."
  },
  {
    "target": "NPC 1",
    "text": "Sounds good. I will show you the way."
    }
]</textarea>
<button id="playJSON" style="width:100%;margin-top:7px">Play JSON</button>
</section>

<h3>Map</h3>
<label>Map GLB URL</label>
<input id="mapURL" placeholder="https://example.com/map.glb">
<button id="loadMap" style="width:100%;margin-top:7px">Load map</button>
<h3>Character chat</h3>
<label>Uhh.</label>
<input id="chatCharacter" value="Alex">
<div id="status">Ready.</div>
</div>
<div id="chat" hidden>
<div id="chatLog">Episode chat</div>
<input id="chatInput" placeholder="Say something...">
<button id="sendChat" style="width:100%">Send</button>
</div>
<div id="crosshair"></div>
<div id="subtitle" role="status" aria-live="polite"></div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import RAPIER from "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm";

const $ = id => document.getElementById(id);
const status = message => $("status").textContent = message;

let scene,camera,renderer,loader,world;
let characters = new Map();
let npcs = [];
let cars = [];
let mapObject = null;
let activeMode = "ai";
let clock = new THREE.Clock();
let cameraTarget = null;
let isPlayingJSON = false;
const cameraLookOffset = new THREE.Vector3(0,1.5,0);
const cameraFollowOffset = new THREE.Vector3(0,3.2,7);
const cameraLookMatrix = new THREE.Matrix4();
const cameraTargetQuaternion = new THREE.Quaternion();

const raycaster = new THREE.Raycaster();
const keys = {};

async function init(){
 await RAPIER.init();

 scene = new THREE.Scene();
 scene.background = new THREE.Color(0x9bc9ed);
 scene.fog = new THREE.Fog(0x9bc9ed,60,180);

 camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
 camera.position.set(0,5,12);

 renderer = new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled = true;
 $("game").appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x777766,2));

 const sun = new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(20,40,10);
 sun.castShadow = true;
 scene.add(sun);

 const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({color:0x47964b})
 );
 ground.rotation.x = -Math.PI/2;
 ground.receiveShadow = true;
 scene.add(ground);

 world = new RAPIER.World({x:0,y:-9.81,z:0});

 loader = new GLTFLoader();

 window.addEventListener("resize",resize);
 window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
 window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

 renderer.domElement.addEventListener("click",()=>{
  if(!$("panel").contains(document.activeElement) &&
     !$("chat").contains(document.activeElement)){
   renderer.domElement.requestPointerLock?.();
  }
 });

 animate();
 status("3D scene ready.");
}

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

function loadGLB(url){
 return new Promise((resolve,reject)=>{
  if(!url)return reject(new Error("Missing GLB URL."));
  loader.load(url,gltf=>{
   const object=gltf.scene;
   object.traverse(child=>{
    if(child.isMesh){
     child.castShadow=true;
     child.receiveShadow=true;
    }
   });
   resolve(object);
  },undefined,error=>{
   const reason=error?.message||"The file could not be read.";
   reject(new Error(`Could not load 3D model "${url}". Check that the URL serves a complete GLB file. ${reason}`));
  });
 });
}

function randomPosition(range=15){
 return new THREE.Vector3(
  (Math.random()-.5)*range*2,
  0,
  (Math.random()-.5)*range*2
 );
}

function addNameTag(object,name){
 const canvas=document.createElement("canvas");
 canvas.width=512;
 canvas.height=100;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="rgba(20,15,30,.8)";
 ctx.fillRect(0,0,512,100);
 ctx.fillStyle="white";
 ctx.font="bold 42px Arial";
 ctx.textAlign="center";
 ctx.fillText(name,256,65);
 const texture=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 sprite.scale.set(3,0.6,1);
 sprite.position.y=3;
 object.add(sprite);
}

async function createCharacter(data){
 const name=data.name||"Character";
 const model=data.model||data.glb;
 const object=await loadGLB(model);
 const pos=data.position||[0,0,0];
 object.position.set(pos[0],pos[1],pos[2]);
 object.scale.setScalar(data.scale||1);
 object.userData.characterName=name;
 object.userData.fishaudio=data.fishaudio||"";
 object.userData.prompt=data.prompt||"You are a friendly character.";
 object.userData.ragdolled=false;
 object.userData.wander=false;

 scene.add(object);
 addNameTag(object,name);

 const body=world.createRigidBody(
  RAPIER.RigidBodyDesc.dynamic()
   .setTranslation(pos[0],pos[1]+1,pos[2])
   .setCanSleep(false)
 );
 const collider=world.createCollider(
  RAPIER.ColliderDesc.capsule(.65,.35)
   .setMass(1),
  body
 );

 const character={
  name,object,body,collider,
  fishaudio:object.userData.fishaudio,
  prompt:object.userData.prompt
 };
 characters.set(name,character);
 return character;
}

async function createNPCS(data){
 const count=Math.min(50,Math.max(0,Number(data.count)||1));
 const models=data.models||data.glbs||[];
 if(!models.length)throw new Error("createNPCS needs a models array.");

 for(let i=0;i<count;i++){
  const model=models[Math.floor(Math.random()*models.length)];
  const position=randomPosition(data.rangePos||15);
  const character=await createCharacter({
   name:`NPC ${i+1}`,
   model,
   position:[position.x,0,position.z],
   scale:data.scale||1
  });
  character.object.userData.wander=data.wander!==false;
  character.object.userData.wanderTarget=randomPosition(data.rangePos||15);
  npcs.push(character);
 }
}

async function createTraffic(data){
 const models=data.cars||[];
 if(!models.length)throw new Error("createTraffic needs a cars array.");

 const count=Math.min(40,Math.max(0,Number(data.count)||1));
 const speed=Number(data.speed)||5;

 for(let i=0;i<count;i++){
  const model=models[Math.floor(Math.random()*models.length)];
  const car=await loadGLB(model);
  car.position.set(-50,0,Math.random()*8-4);
  car.rotation.y=Math.PI/2;
  car.userData.speed=speed*(.8+Math.random()*.4);
  car.userData.startX=-50;
  car.userData.endX=50;
  scene.add(car);
  cars.push(car);
 }
}

async function loadMap(url){
 if(mapObject)scene.remove(mapObject);
 mapObject=await loadGLB(url);
 mapObject.position.set(0,0,0);
 scene.add(mapObject);
}

async function sayAs(character,text){
  const subtitle=$("subtitle");
  subtitle.textContent=`${character.name}: ${text}`;
  subtitle.style.display="block";
  cameraTarget=character;

  try{
   if(character.fishaudio){
    try{
     const response=await fetch("/api/fish",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
       text,
       fishaudio:character.fishaudio
      })
     });
     if(!response.ok)throw new Error("Fish Audio request failed.");
     const blob=await response.blob();
     const audioURL=URL.createObjectURL(blob);
     const audio=new Audio(audioURL);
     const playbackEnded=new Promise(resolve=>{
      audio.addEventListener("ended",resolve,{once:true});
      audio.addEventListener("error",resolve,{once:true});
     });
     try{
      await audio.play();
      await playbackEnded;
      return;
     }finally{
      URL.revokeObjectURL(audioURL);
     }
    }catch(error){
     console.warn(error);
    }
  }

   if(window.speak){
    const result=window.speak(text);
    if(result&&typeof result.then==="function"){
     await result;
    }else{
     await new Promise(resolve=>setTimeout(resolve,Math.max(1200,Math.min(8000,String(text).length*55))));
    }
   }else if("speechSynthesis" in window){
    await new Promise(resolve=>{
     const utterance=new SpeechSynthesisUtterance(text);
     utterance.onend=resolve;
     utterance.onerror=resolve;
     speechSynthesis.speak(utterance);
    });
   }else{
    await new Promise(resolve=>setTimeout(resolve,Math.max(1200,Math.min(8000,String(text).length*55))));
   }
  }finally{
   subtitle.style.display="none";
   subtitle.textContent="";
   if(cameraTarget===character)cameraTarget=null;
 }
}

async function characterReply(name,message){
 const character=characters.get(name);
 if(!character)throw new Error("Character not found: "+name);

 const response=await fetch("/api/character-ai",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   name:character.name,
   prompt:character.prompt,
   message
  })
 });
 const data=await response.json();
 if(!response.ok||!data.success)throw new Error(data.error||"Character AI failed.");
 await sayAs(character,data.text);
 return data.text;
}

async function executeCommand(command){
 if(command.createCharacter){
  await createCharacter(command.createCharacter);
  return;
 }

 if(command.createNPCS){
  await createNPCS(command.createNPCS);
  return;
 }

 if(command.createTraffic){
  await createTraffic(command.createTraffic);
  return;
 }

 if(command.map){
  await loadMap(command.map);
  return;
 }

 if(command.target&&command.text){
  const character=characters.get(command.target);
  if(!character)throw new Error("Unknown character: "+command.target);
  await sayAs(character,command.text);
  return;
 }

 if(command.wait){
  await new Promise(resolve=>setTimeout(resolve,Number(command.wait)));
  return;
 }

 if(command.remove){
  const character=characters.get(command.remove);
  if(character){
   scene.remove(character.object);
   world.removeRigidBody(character.body);
   characters.delete(command.remove);
  }
  return;
 }

 console.warn("Unknown episode command:",command);
}

async function playEpisode(commands){
 if(!Array.isArray(commands))throw new Error("Episode must be a JSON array.");

 for(const command of commands){
  await executeCommand(command);
 }
}

async function generateAI(){
 const prompt=$("prompt").value.trim();
 if(!prompt)return alert("Write an episode prompt first.");

 status("Generating episode with Groq...");
 try{
  const response=await fetch("/api/ai",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt})
  });
  const data=await response.json();
  if(!response.ok||!data.success)throw new Error(data.error||"AI generation failed.");

  $("episodeJSON").value=JSON.stringify(data.episode,null,2);
  $("jsonSection").style.display="block";
  $("aiSection").style.display="none";
  activeMode="json";
  status("Episode generated. Press Play JSON.");
 }catch(error){
  status(error.message);
 }
}

async function playJSON(){
  if(isPlayingJSON)return;
  isPlayingJSON=true;
  document.body.classList.add("json-playing");
  $("playJSON").disabled=true;
 try{
  const commands=JSON.parse($("episodeJSON").value);
  status("Playing episode...");
  await playEpisode(commands);
  status("Episode finished.");
 }catch(error){
  status("Error: "+error.message);
  }finally{
   isPlayingJSON=false;
   document.body.classList.remove("json-playing");
   $("playJSON").disabled=false;
 }
}

function updateNPCs(delta){
 for(const npc of npcs){
  if(!npc.object.userData.wander||npc.object.userData.ragdolled)continue;

  const target=npc.object.userData.wanderTarget;
  const dx=target.x-npc.object.position.x;
  const dz=target.z-npc.object.position.z;
  const distance=Math.hypot(dx,dz);

  if(distance<1){
   npc.object.userData.wanderTarget=randomPosition(15);
   continue;
  }

  const speed=1.5;
  npc.object.position.x+=(dx/distance)*speed*delta;
  npc.object.position.z+=(dz/distance)*speed*delta;
  npc.object.rotation.y=Math.atan2(dx,dz);
 }
}

function updateCars(delta){
 for(const car of cars){
  car.position.x+=car.userData.speed*delta;
  if(car.position.x>car.userData.endX){
   car.position.x=car.userData.startX;
  }
 }
}

function checkCharacterCollisions(){
 const list=[...characters.values()];
 for(let i=0;i<list.length;i++){
  for(let j=i+1;j<list.length;j++){
   const a=list[i],b=list[j];
   if(a.object.userData.ragdolled||b.object.userData.ragdolled)continue;
   if(a.object.position.distanceTo(b.object.position)<.9){
    // Gentle game-style stumble effect, not a physical skeletal ragdoll.
    a.object.userData.stumbleUntil=performance.now()+500;
    b.object.userData.stumbleUntil=performance.now()+500;
   }
  }
 }
}

function updateStumbles(){
 for(const character of characters.values()){
  const until=character.object.userData.stumbleUntil||0;
  if(performance.now()<until){
   character.object.rotation.z=Math.sin(performance.now()*.03)*.18;
  }else{
   character.object.rotation.z=THREE.MathUtils.damp(
    character.object.rotation.z,0,8,clock.getDelta()
   );
  }
 }
}

function animate(){
 requestAnimationFrame(animate);
 const delta=Math.min(clock.getDelta(),.05);

 world?.step();
 updateNPCs(delta);
 updateCars(delta);
 checkCharacterCollisions();

 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();
 const right=new THREE.Vector3().crossVectors(forward,camera.up).normalize();

 const movement=new THREE.Vector3();
 if(keys.w)movement.add(forward);
 if(keys.s)movement.sub(forward);
 if(keys.d)movement.add(right);
 if(keys.a)movement.sub(right);

  if(!cameraTarget&&movement.lengthSq()){
  movement.normalize().multiplyScalar(7*delta);
  camera.position.add(movement);
 }

  if(!cameraTarget&&keys.space)camera.position.y+=5*delta;
  if(!cameraTarget&&keys.shift)camera.position.y-=5*delta;

  if(cameraTarget){
   const target=cameraTarget.object.position;
   const desiredPosition=target.clone().add(cameraFollowOffset);
   const lookAtPosition=target.clone().add(cameraLookOffset);
   camera.position.lerp(desiredPosition,1-Math.exp(-3.5*delta));
   cameraTargetQuaternion.setFromRotationMatrix(
    cameraLookMatrix.lookAt(camera.position,lookAtPosition,camera.up)
   );
   camera.quaternion.slerp(cameraTargetQuaternion,1-Math.exp(-5*delta));
  }

 renderer.render(scene,camera);
}

$("aiMode").onclick=()=>{
 $("aiSection").style.display="block";
 $("jsonSection").style.display="none";
 activeMode="ai";
};

$("jsonMode").onclick=()=>{
 $("aiSection").style.display="none";
 $("jsonSection").style.display="block";
 activeMode="json";
};

$("generateAI").onclick=generateAI;
$("playJSON").onclick=playJSON;

$("loadMap").onclick=async()=>{
 try{
  await loadMap($("mapURL").value.trim());
  status("Map loaded.");
 }catch(error){status(error.message);}
};

$("togglePanel").onclick=()=>$("panel").classList.toggle("hidden");
$("hidePanel").onclick=()=>$("panel").classList.add("hidden");

$("resetScene").onclick=()=>{
  cameraTarget=null;
  $("subtitle").style.display="none";
  $("subtitle").textContent="";
 for(const character of characters.values()){
  scene.remove(character.object);
  world.removeRigidBody(character.body);
 }
 characters.clear();
 npcs=[];
 for(const car of cars)scene.remove(car);
 cars=[];
 if(mapObject)scene.remove(mapObject);
 mapObject=null;
 status("Scene reset.");
};

function addChat(text){
 const log=$("chatLog");
 log.textContent+="\n"+text;
 log.scrollTop=log.scrollHeight;
}

async function sendChat(){
 const message=$("chatInput").value.trim();
 const name=$("chatCharacter").value.trim();
 if(!message)return;

 $("chatInput").value="";
 addChat("You: "+message);

 try{
  const reply=await characterReply(name,message);
  addChat(name+": "+reply);
 }catch(error){
  addChat("Error: "+error.message);
 }
}

$("sendChat").onclick=sendChat;
$("chatInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendChat();
});

init().catch(error=>{
 console.error(error);
 status("Initialization error: "+error.message);
});
</script>
</body>
</html>
